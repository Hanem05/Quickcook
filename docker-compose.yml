services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickcook_app
    working_dir: /var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: quickcook
      DB_USERNAME: quickcook
      DB_PASSWORD: root
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./quick_cook_backend:/var/www
      - ./imgs:/var/www/imgs-seed:ro
    depends_on:
      - db
      - redis   # 👈 ADD THIS

  nginx:
    image: nginx:alpine
    container_name: quickcook_nginx
    ports:
      - "8001:80"
    volumes:
      - ./quick_cook_backend:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # 🔥 Continuously pre-warms PHP-FPM workers and key endpoint caches so the
  # first user request is always served from a hot pipeline. Docker + Windows
  # bind mounts cause PHP-FPM workers to age out and produce 2-5s cold spikes;
  # a quiet ping every 25s keeps a worker resident.
  warmup:
    image: alpine:3.20
    container_name: quickcook_warmup
    depends_on:
      - app
      - nginx
    restart: unless-stopped
    command: >
      sh -c "apk add --no-cache curl >/dev/null 2>&1 && \
      sleep 4 && \
      while true; do \
        curl -s -o /dev/null --max-time 5 http://nginx/api/ingredients; \
        curl -s -o /dev/null --max-time 5 'http://nginx/api/recipes?compact=1&per_page=80'; \
        sleep 25; \
      done"

  db:
    image: mysql:8
    container_name: quickcook_db
    restart: always
    environment:
      MYSQL_DATABASE: quickcook
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: quickcook
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 🔥 ADD THIS BLOCK
  redis:
    image: redis:alpine
    container_name: quickcook_redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
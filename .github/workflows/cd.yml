name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main, master]
    types: [completed]
  workflow_dispatch:

jobs:
  build-release-artifacts:
    name: Build Release Artifacts
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install backend dependencies
        working-directory: quick_cook_backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare backend test environment
        working-directory: quick_cook_backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit (dot output)
        working-directory: quick_cook_backend
        run: |
          mkdir -p build
          vendor/bin/phpunit --colors=always --log-junit build/phpunit-report.xml

      - name: Enforce minimum PHPUnit test count (70+)
        working-directory: quick_cook_backend
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = "build/phpunit-report.xml"
          try:
              root = ET.parse(path).getroot()
          except Exception as exc:
              print(f"Unable to read PHPUnit report: {exc}", file=sys.stderr)
              sys.exit(1)

          tests_attr = root.attrib.get("tests")
          if tests_attr is not None:
              tests = int(tests_attr)
          else:
              tests = sum(int(node.attrib.get("tests", "0")) for node in root.iter("testsuite"))

          print(f"PHPUnit tests executed: {tests}")
          if tests < 70:
              print("Expected at least 70 PHPUnit tests in CD.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter web
        working-directory: quickcook_app
        run: |
          flutter pub get
          flutter build web --release

      - name: Package backend source
        run: |
          tar -czf quickcook-backend-src.tar.gz quick_cook_backend

      - name: Upload Flutter web artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickcook-web-build
          path: quickcook_app/build/web

      - name: Upload backend source artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickcook-backend-source
          path: quickcook-backend-src.tar.gz

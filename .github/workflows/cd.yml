name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main, master]
    types: [completed]
  workflow_dispatch:

jobs:
  build-release-artifacts:
    name: Build Release Artifacts
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install backend dependencies
        working-directory: quick_cook_backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare backend test environment
        working-directory: quick_cook_backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit (dot output)
        working-directory: quick_cook_backend
        run: |
          mkdir -p build
          vendor/bin/phpunit --colors=always --log-junit build/phpunit-report.xml

      - name: Enforce minimum PHPUnit test count (70+)
        working-directory: quick_cook_backend
        run: |
          php <<'PHP'
          <?php
          $xml = simplexml_load_file('build/phpunit-report.xml');
          if (! $xml) {
              fwrite(STDERR, "Unable to read PHPUnit report".PHP_EOL);
              exit(1);
          }
          $attrs = $xml->attributes();
          $tests = isset($attrs['tests']) ? (int) $attrs['tests'] : 0;
          echo 'PHPUnit tests executed: '.$tests.PHP_EOL;
          if ($tests < 70) {
              fwrite(STDERR, "Expected at least 70 PHPUnit tests in CD.".PHP_EOL);
              exit(1);
          }
          PHP

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter web
        working-directory: quickcook_app
        run: |
          flutter pub get
          flutter build web --release

      - name: Package backend source
        run: |
          tar -czf quickcook-backend-src.tar.gz quick_cook_backend

      - name: Upload Flutter web artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickcook-web-build
          path: quickcook_app/build/web

      - name: Upload backend source artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickcook-backend-source
          path: quickcook-backend-src.tar.gz

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main, master]
    types: [completed]
  workflow_dispatch:

jobs:
  build-release-artifacts:
    name: Build Release Artifacts
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter web
        working-directory: quickcook_app
        run: |
          flutter pub get
          flutter build web --release

      - name: Package backend source
        run: |
          tar -czf quickcook-backend-src.tar.gz quick_cook_backend

      - name: Upload Flutter web artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickcook-web-build
          path: quickcook_app/build/web

      - name: Upload backend source artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickcook-backend-source
          path: quickcook-backend-src.tar.gz
